<div style="text-align:center; padding: 20px;">
    <h1>Backend Camera Stream</h1>
    
    <img [src]="latestFrame" *ngIf="latestFrame" 
        style="width: 100%; max-width: 800px; border: 5px solid #222;">
    
    <div style="margin-top: 20px; font-size: 1.5rem;">
    <strong>Current FEN:</strong> 
    <pre style="background: #eee; padding: 10px;">{{ currentFen }}</pre>
    </div>
</div>
